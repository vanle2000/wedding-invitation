  <rect width="800" height="520" filter="url(#g)" opacity="0.18"/>
  <text x="400" y="500" text-anchor="middle" font-family="Jost, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#F7F4EC" opacity="0.85">PLACEHOLDER PHOTOGRAPH</text>
