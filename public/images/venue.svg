      <stop offset="0" stop-color="#E9E4D4"/>
      <stop offset="1" stop-color="#D3CFBE"/>
    </linearGradient>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <!-- tree line -->
  <path d="M0 330 C 80 300, 140 320, 200 300 C 260 280, 330 310, 400 290 C 480 270, 560 300, 640 280 C 700 265, 760 290, 800 280 L800 520 L0 520 Z" fill="#A8AE97"/>
