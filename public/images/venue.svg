    <rect x="215" y="230" width="60" height="150"/>
    <rect x="525" y="230" width="60" height="150"/>
    <path d="M215 230 L245 180 L275 230 Z"/>
    <path d="M525 230 L555 180 L585 230 Z"/>
    <path d="M250 250 L400 200 L550 250 Z"/>
  </g>
  <g fill="#6F7A66">
    <rect x="285" y="285" width="18" height="34"/><rect x="330" y="285" width="18" height="34"/><rect x="375" y="285" width="18" height="34"/>
    <rect x="420" y="285" width="18" height="34"/><rect x="465" y="285" width="18" height="34"/><rect x="510" y="285" width="18" height="34"/>
    <rect x="388" y="335" width="24" height="45"/>
    <rect x="238" y="270" width="14" height="26"/><rect x="548" y="270" width="14" height="26"/>
  </g>
  <!-- lawn + reflecting water -->
  <path d="M0 380 L800 380 L800 520 L0 520 Z" fill="#8D9780"/>
  <path d="M0 440 C 200 430, 600 450, 800 440 L800 520 L0 520 Z" fill="#B9BCA7" opacity="0.75"/>
  <path d="M250 455 L550 455 L560 500 L240 500 Z" fill="#DED9C8" opacity="0.35"/>
  <!-- cypress pairs -->
  <g fill="#5F6A57">
    <path d="M150 400 C 140 350, 143 300, 150 250 C 157 300, 160 350, 150 400 Z"/>
    <path d="M180 410 C 172 365, 175 320, 180 280 C 185 320, 188 365, 180 410 Z"/>
    <path d="M650 400 C 640 350, 643 300, 650 250 C 657 300, 660 350, 650 400 Z"/>
    <path d="M620 410 C 612 365, 615 320, 620 280 C 625 320, 628 365, 620 410 Z"/>
